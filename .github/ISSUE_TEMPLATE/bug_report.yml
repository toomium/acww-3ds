name: Bug report
description: Something looks wrong, crashes or doesn't work in the game.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Please **don't attach your ROM, your save or a build of the game**: they contain game data and can't be shared here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps that lead to the bug, if you know them.
  - type: dropdown
    id: device
    attributes:
      label: Where are you playing?
      options:
        - New 3DS / New 3DS XL / New 2DS XL
        - Old 3DS / 3DS XL / 2DS
        - Azahar (emulator)
        - Other
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit of this repository you built.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: Drag in `sd:/3ds/acww/log.txt` from your SD card (or Azahar's SD folder), and your `acww.cfg` if you have one. It helps a lot.
  - type: textarea
    id: pictures
    attributes:
      label: Screenshots or video
      description: "Optional. On the 3DS: L + Down + Select opens Luma's menu, then Take screenshot."
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I searched the existing issues and this isn't already reported.
          required: true
        - label: I'm using my own dump of Animal Crossing - Wild World (USA, Rev 1).
          required: true
